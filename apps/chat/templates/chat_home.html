{% extends "app.html" %}

{% block body %}

<div id="chat-page">

<div id="chat-messages">

{% for m in messages %}

<div class="chat-message">
<div class="chat-meta">
<span class="chat-name" style="color: {{ m.username | tag_color }}">{{ m.username | lower }}</span>
<span class="chat-time">{{ m.display_time }}</span>
</div>
<div class="chat-body">{{ m.text }}</div>
</div>

{% else %}

<p class="muted">no messages in {{ group_name | lower }} yet.</p>

{% endfor %}

</div>

<form method="post" id="chat-form">

<textarea
    name="text"
    id="chat-input"
    placeholder="start typing and press enter to send"
    spellcheck="false"
    autocomplete="off"
    autofocus></textarea>

</form>

</div>

<script>

const chatMessages = document.getElementById("chat-messages");
chatMessages.scrollTop = chatMessages.scrollHeight;

const chatForm = document.getElementById("chat-form");
const chatInput = document.getElementById("chat-input");

function resizeChatInput() {
    chatInput.style.height = "0px";
    chatInput.style.height = chatInput.scrollHeight + "px";
}

chatInput.addEventListener("input", resizeChatInput);

chatInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (chatInput.value.trim()) chatForm.submit();
    }
});

resizeChatInput();
chatInput.focus();

</script>

{% endblock %}
