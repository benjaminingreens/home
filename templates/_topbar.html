{% if current_user_ctx %}

<nav class="topbar">
<button type="button" class="topbar-seg topbar-app" onclick="openMenu('app')">{{ (app_label or "home") | lower }}</button>
</nav>

<div id="menu-app" class="menu-overlay hidden">

<div class="menu-header">
<button type="button" class="menu-close" onclick="closeMenus()" aria-label="close menu">&times;</button>
<div class="menu-title">select app</div>
<input type="text" class="menu-search" placeholder="search..." autocomplete="off" oninput="filterMenu('app', this.value)">
</div>

<div class="menu-list">
{% for a in nav_apps %}
<a href="/apps/{{ a.id }}/" class="menu-item{{ ' active' if a.name == app_label }}" data-search="{{ a.name | lower }}">{{ a.name | lower }}</a>
{% endfor %}
</div>

<div class="menu-footer">
<a href="/" class="menu-item menu-home">go home</a>
<a href="/logout" class="menu-item menu-logout">log out of {{ current_user_ctx.username | lower }}</a>
</div>

</div>

{% endif %}
