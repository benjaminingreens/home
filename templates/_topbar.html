<nav class="topbar">

<a href="{{ app_home or '/' }}" class="topbar-app">{{ (app_label or "home") | lower }}</a>

{% if workspace_options is defined %}

<form method="post" action="/apps/ark/workspaces" class="topbar-form">
<input type="hidden" name="action" value="switch">
<select name="workspace_id" class="topbar-select" onchange="this.form.submit()">
{% for w in workspace_options %}
<option value="{{ w.id }}" {% if w.id == active_workspace_id %}selected{% endif %}>{{ w.group_name | lower }} / {{ w.name }}</option>
{% endfor %}
</select>
</form>

{% if git_linked %}
<form method="post" action="/apps/ark/sync" class="topbar-form">
<button type="submit" class="topbar-btn">sync</button>
</form>
{% elif git_linked is defined %}
<a href="/apps/ark/workspace" class="topbar-workspace">link</a>
{% endif %}

{% elif workspace_label %}
<a href="/apps/ark/workspaces" class="topbar-workspace">{{ workspace_label | lower }}</a>
{% endif %}

{% if user %}
<a href="/" class="topbar-user">{{ user["username"] | lower }}</a>
<a href="/logout">logout</a>
{% endif %}

</nav>
