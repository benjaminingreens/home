<!doctype html>

<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ title or "App" }}</title>

<link rel="stylesheet" href="/static/home.css">

{% if current_user_ctx %}
<style>:root {
    --bg-color: {{ bg_color }};
    --fg-color: {{ fg_color }};
    --fg-muted: {{ fg_muted_color }};
    --fg-faint: {{ fg_faint_color }};
    --border-color: {{ border_color }};
}</style>
{% endif %}

</head>

<body class="{{ page_class }}">

{% include "_topbar.html" %}

{% block body %}
{% endblock %}

{% include "_bottombar.html" %}

</body>

</html>
