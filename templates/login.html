{% extends "base.html" %}

{% block body %}

<h1>login</h1>

<form method="post" class="authform">

<label>

<span>username</span>

<input
    name="username"
    autocomplete="username"
    autofocus
>

</label>

<label>

<span>password</span>

<input
    name="password"
    type="password"
    autocomplete="current-password"
>

</label>

<button type="submit">login</button>

</form>

{% endblock %}
